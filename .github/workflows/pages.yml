# Deploy all release channels to GitHub Pages on any channel push.
# Spec: README.md "Deployment" (dev-first flow). One Pages site, three channels:
#   /       <- prod  (human-promoted via scripts/promote; gated as backstop)
#   /beta/  <- beta  (promoted release candidate; prod gates)
#   /dev/   <- dev   (tracks main on every land; build only - main is loop-gated)
# main maps to NO channel: its content reaches Pages via the `main:dev` push.
# A Pages deploy replaces the whole site, so every run assembles all channels
# from their branch heads. Prod failure kills the deploy; dev/beta failures
# warn and deploy without that channel - a broken experiment must never block
# redeploying prod.
name: Deploy to GitHub Pages

on:
  push:
    branches: [prod, dev, beta]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: prod channel (prod, gated)
        run: |
          set -euo pipefail
          git checkout --force --detach origin/prod
          npm ci
          npm test
          # Gates are guarded because every run assembles all channels from their
          # branch heads, and a channel head may predate a gate script this file
          # names. A gate is a property of the commit it guards (README
          # "Deployment") — hard-failing here bricks the whole site instead.
          # ADR-0017: the two BALANCE gates below are ADVISORY — they run and print,
          # they never fail the build, because the arsenal is still moving and a gate
          # against a moving target is false precision. npm test and the perf gate
          # stay hard: they measure code, not design target. Re-arm when the weapons
          # stop changing, and re-derive both bands first.
          # onboarding-band reading (README Deployment, ADR-0003)
          if [ -f scripts/calibrate.mjs ]; then node scripts/calibrate.mjs 32 || echo "::warning::calibrate out of band - ADVISORY only (ADR-0017)"
          else echo "::notice::calibrate gate absent on this channel head - skipped"; fi
          # conductor gate (README balance tooling, GDD §3): delegation law enforced
          if [ -f scripts/conductor.mjs ]; then node scripts/conductor.mjs || echo "::warning::conductor red - ADVISORY only (ADR-0017)"
          else echo "::notice::conductor gate absent on this channel head - skipped"; fi
          # JS-cost gate (README performance tooling): bounds OUR javascript only —
          # a stub canvas is blind to rasterisation. Catches an O(n^2) landing, not
          # a slow phone. Existence-checked: prod's head predates this script.
          if [ -f scripts/perf.mjs ]; then node scripts/perf.mjs 25
          else echo "::notice::perf gate absent on this channel head - skipped"; fi
          npm run build
          mkdir -p site
          # dist/ is multi-file since the PWA manifest (README "Deployment")
          cp dist/index.html site/
          # Optional artifacts: a channel head may predate them (README
          # "Deployment"). index.html is the only guaranteed one.
          if [ -e dist/manifest.webmanifest ]; then
            cp dist/manifest.webmanifest dist/icon-*.png site/
          else echo "::notice::PWA assets absent on this channel head - index.html only"; fi
      - name: beta channel (beta, gated)
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! git show-ref -q refs/remotes/origin/beta; then
            echo "no beta branch - channel skipped"; exit 0
          fi
          git checkout --force --detach origin/beta
          npm ci
          npm test
          # Guarded for the same reason as prod, above.
          if [ -f scripts/calibrate.mjs ]; then node scripts/calibrate.mjs 32 || echo "::warning::calibrate out of band - ADVISORY only (ADR-0017)"
          else echo "::notice::calibrate gate absent on this channel head - skipped"; fi
          if [ -f scripts/conductor.mjs ]; then node scripts/conductor.mjs || echo "::warning::conductor red - ADVISORY only (ADR-0017)"
          else echo "::notice::conductor gate absent on this channel head - skipped"; fi
          # JS-cost gate (README performance tooling): bounds OUR javascript only —
          # a stub canvas is blind to rasterisation. Catches an O(n^2) landing, not
          # a slow phone. Existence-checked: prod's head predates this script.
          if [ -f scripts/perf.mjs ]; then node scripts/perf.mjs 25
          else echo "::notice::perf gate absent on this channel head - skipped"; fi
          npm run build
          mkdir -p site/beta
          cp dist/index.html site/beta/
          # Optional artifacts: a channel head may predate them (README
          # "Deployment"). index.html is the only guaranteed one.
          if [ -e dist/manifest.webmanifest ]; then
            cp dist/manifest.webmanifest dist/icon-*.png site/beta/
          else echo "::notice::PWA assets absent on this channel head - index.html only"; fi
      - name: dev channel (dev, build only)
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! git show-ref -q refs/remotes/origin/dev; then
            echo "no dev branch - channel skipped"; exit 0
          fi
          git checkout --force --detach origin/dev
          npm ci
          npm run build
          mkdir -p site/dev
          cp dist/index.html site/dev/
          # Optional artifacts: a channel head may predate them (README
          # "Deployment"). index.html is the only guaranteed one.
          if [ -e dist/manifest.webmanifest ]; then
            cp dist/manifest.webmanifest dist/icon-*.png site/dev/
          else echo "::notice::PWA assets absent on this channel head - index.html only"; fi
      - name: gdd (dev head - the living design doc)
        continue-on-error: true
        run: |
          set -euo pipefail
          if ! git show-ref -q refs/remotes/origin/dev; then
            echo "no dev branch - gdd skipped"; exit 0
          fi
          git checkout --force --detach origin/dev
          mkdir -p site/gdd
          cp -r gdd/. site/gdd/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
